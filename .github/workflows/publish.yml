name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run package
      - id: vsix
        run: echo "file=$(ls *.vsix | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
      - name: Publish Open VSX
        if: startsWith(github.ref, 'refs/tags/') && secrets.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "${{ steps.vsix.outputs.file }}" --skip-duplicate
      - name: Publish Marketplace
        if: startsWith(github.ref, 'refs/tags/') && secrets.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.vsix.outputs.file }}" --skip-duplicate
